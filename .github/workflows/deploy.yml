name: Build, Terraform Plan & Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build EntraMcpMvp.sln
      - run: dotnet test EntraMcpMvp.sln --no-build

  gateway-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/OAuthGateway
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            src/OAuthGateway/requirements.txt
            src/OAuthGateway/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check gateway
      - name: Unit-, OAuth-Security- und MCP-Integrationstests
        run: pytest tests -q
      - name: Dependency-Scan (bekannte Schwachstellen)
        run: pip-audit -r requirements.txt
      - name: Secret-Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Secret-freies Deployment-Artefakt bauen
        run: ./build_artifact.sh dist/gateway.zip "${GITHUB_SHA}"
      - uses: actions/upload-artifact@v4
        with:
          name: oauth-gateway-${{ github.sha }}
          path: src/OAuthGateway/dist/gateway.zip
          if-no-files-found: error

  terraform-plan:
    needs: [build, gateway-ci]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.5'
          terraform_wrapper: false
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Terraform fmt und validate
        run: |
          terraform -chdir=terraform fmt -recursive -check
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate
      - name: Terraform Plan (dev)
        shell: pwsh
        run: ./scripts/Invoke-TerraformPlan.ps1 -Environment dev
      - name: Report als PR-Kommentar posten
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = 'reports';
            const files = fs.readdirSync(dir).filter(f => f.startsWith('tfplan-dev-') && f.endsWith('.md'));
            const latest = files.sort().reverse()[0];
            const content = fs.readFileSync(path.join(dir, latest), 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: content
            });

  deploy-dev:
    needs: [build, gateway-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.5'
          terraform_wrapper: false
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Apply (dev)
        shell: pwsh
        run: ./scripts/Invoke-TerraformApply.ps1 -Environment dev -AutoApprove

      - name: Terraform Outputs fuer App Deployment lesen
        shell: pwsh
        run: |
          $outputs = terraform -chdir=terraform output -json | ConvertFrom-Json
          $apiAppName = $outputs.api_app_hostname.value -replace '\.azurewebsites\.net$', ''
          $mcpAppName = $outputs.mcp_app_hostname.value -replace '\.azurewebsites\.net$', ''

          "API_APP_NAME=$apiAppName" >> $env:GITHUB_ENV
          "MCP_APP_NAME=$mcpAppName" >> $env:GITHUB_ENV
          "API_APP_HOSTNAME=$($outputs.api_app_hostname.value)" >> $env:GITHUB_ENV
          "MCP_APP_HOSTNAME=$($outputs.mcp_app_hostname.value)" >> $env:GITHUB_ENV

          if ($apiAppName -notlike '*-api') {
            throw "Ungueltiger API App Name aus Terraform Output: $apiAppName"
          }
          if ($mcpAppName -notlike '*-mcp') {
            throw "Ungueltiger MCP App Name aus Terraform Output: $mcpAppName"
          }

      - name: ApiServer publish
        run: dotnet publish src/ApiServer/ApiServer.csproj --configuration Release --output publish/api

      - name: McpServer publish
        run: dotnet publish src/McpServer/McpServer.csproj --configuration Release --output publish/mcp

      - name: Deploy ApiServer package
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.API_APP_NAME }}
          package: publish/api

      - name: Deploy McpServer package
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.MCP_APP_NAME }}
          package: publish/mcp

      # Gateway wird nur deployt, wenn enable_gateway=true (Terraform-Output gateway_app_name nicht null).
      # Auth: bestehender azure/login OIDC-Kontext; kein Publish-Profile, kein langlebiges Secret.
      - name: Gateway-Ziel aus Terraform lesen
        id: gw
        shell: pwsh
        run: |
          $o = terraform -chdir=terraform output -json | ConvertFrom-Json
          $name = $o.gateway_app_name.value
          if ($name) {
            if ($name -notlike '*-oauth-gateway') { throw "Ungueltiger Gateway App Name: $name" }
            "enabled=true" >> $env:GITHUB_OUTPUT
            "app_name=$name" >> $env:GITHUB_OUTPUT
          } else {
            "enabled=false" >> $env:GITHUB_OUTPUT
          }

      - name: Gateway-Artefakt laden
        if: steps.gw.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: oauth-gateway-${{ github.sha }}
          path: gateway-artifact

      - name: Deploy Gateway (Python Code-Deployment, kein Container)
        if: steps.gw.outputs.enabled == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.gw.outputs.app_name }}
          package: gateway-artifact/gateway.zip

      - name: Gateway Smoke-Test
        if: steps.gw.outputs.enabled == 'true'
        run: |
          url="https://${{ steps.gw.outputs.app_name }}.azurewebsites.net"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$url/healthz" || true)
            [ "$code" = "200" ] && break; sleep 20
          done
          [ "$code" = "200" ] || { echo "Gateway /healthz lieferte $code"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$url/mcp" -H 'Content-Type: application/json' -d '{}')
          [ "$code" = "401" ] || { echo "Erwartet 401 ohne Token, erhalten $code"; exit 1; }
          curl -sf "$url/.well-known/oauth-authorization-server" | grep -q "registration_endpoint"

      - name: Deployment Ergebnis
        run: |
          echo "ApiServer: https://${API_APP_HOSTNAME}"
          echo "McpServer: https://${MCP_APP_HOSTNAME}"
